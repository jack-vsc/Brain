# Fase 2b — baseline Transformer (pre-LN, RoPE, bidirecional). Mesmo orçamento dos outros.
# lr menor que o das GRUs: Transformers costumam divergir com 2e-3 (ver relatório).
[run]
name = "b_transformer"
seed = 1
data_dir = "data/generated/mvp2"

[model]
type = "transformer"
d_model = 192
layers = 4
heads = 4
ff = 576
dropout = 0.1
question_position = "after"

[train]
batch_size = 64
lr = 1e-3
max_steps = 8000
warmup_steps = 500
eval_every = 500
early_stop_patience = 8
max_minutes = 120.0
