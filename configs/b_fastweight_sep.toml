# Iteração 3 — memória rápida com separação de padrões e sinal de familiaridade.
# Chaves/consultas de 128 dimensões com só 16 ativas (esparsas); hidden 320 mantém ~1,5 M parâmetros.
# Hipótese H5: chaves esparsas reduzem a interferência entre projetos (isolamento) e
# a familiaridade reduz respostas inventadas quando o esperado é UNKNOWN.
[run]
name = "b_fastweight_sep"
seed = 1
data_dir = "data/generated/mvp2"

[model]
type = "fastweight_gru"
emb_dim = 128
hidden = 320
layers = 2
dropout = 0.1
mem_heads = 4
mem_dim = 48
key_dim = 128
key_topk = 16
familiarity = true
question_position = "after"

[train]
batch_size = 64
lr = 2e-3
max_steps = 8000
warmup_steps = 500
eval_every = 500
early_stop_patience = 8
max_minutes = 120.0
