# Iteração 9 — iteração 2 com a GRU trocada por minGRU (paralela no comprimento), 3 camadas de 470
# para manter ~1,50 M parâmetros. Hipótese: treino bem mais rápido com acerto parecido.
[run]
name = "b_mingru"
seed = 1
data_dir = "data/generated/mvp2"

[model]
type = "fastweight_gru"
emb_dim = 128
hidden = 470
layers = 3
dropout = 0.1
mem_heads = 4
mem_dim = 48
read_hops = 3
rnn = "mingru"
question_position = "after"

[train]
batch_size = 64
lr = 2e-3
max_steps = 8000
warmup_steps = 500
eval_every = 500
early_stop_patience = 8
max_minutes = 120.0
