# Curva de escala (item 1): iteração 2 com ~0,5 M parâmetros. Mesmos dados, lr e batch da iteração 2;
# só a largura muda. A versão de 24 mil passos vem da fila (run.name com sufixo _24k).
[run]
name = "sc_fw_0.5m_8k"
seed = 1
data_dir = "data/generated/mvp2"

[model]
type = "fastweight_gru"
emb_dim = 80
hidden = 192
layers = 2
dropout = 0.1
mem_heads = 4
mem_dim = 32
read_hops = 3
question_position = "after"

[train]
batch_size = 64
lr = 2e-3
max_steps = 8000
warmup_steps = 500
eval_every = 500
early_stop_patience = 8
max_minutes = 240.0
