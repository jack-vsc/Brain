# Iteração 7b — iteração 7 com a porta iniciada quase sem esquecer (viés 6, α ≈ 0,9975 por token).
# Na iteração 7, α ≈ 0,95 no início apagava os fatos do começo das histórias (0,95^60 ≈ 0,05).
[run]
name = "b_gated_slow"
seed = 1
data_dir = "data/generated/mvp2"

[model]
type = "fastweight_gru"
emb_dim = 128
hidden = 336
layers = 2
dropout = 0.1
mem_heads = 4
mem_dim = 48
read_hops = 3
forget_gate = true
forget_bias = 6.0
question_position = "after"

[train]
batch_size = 64
lr = 2e-3
max_steps = 8000
warmup_steps = 500
eval_every = 500
early_stop_patience = 8
max_minutes = 120.0
