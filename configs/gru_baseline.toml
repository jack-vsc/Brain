# Baseline da Fase 2: embedding + GRU + cabeça, sem memória externa.
# A pergunta vem DEPOIS da história: a rede precisa manter todo o estado relevante.
[run]
name = "gru_qafter"
seed = 1
data_dir = "data/generated/mvp"

[model]
type = "gru"
emb_dim = 128
hidden = 384
layers = 2
dropout = 0.1
question_position = "after"

[train]
batch_size = 64
grad_accum = 1
lr = 2e-3
weight_decay = 0.01
max_steps = 12000
warmup_steps = 500
eval_every = 500
early_stop_patience = 8
max_minutes = 45.0
amp = "auto"
device = "auto"
min_free_vram_mb = 400
vram_margin_mb = 256
