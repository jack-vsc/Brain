# Iteração 5 — iteração 2 (escrita a cada token, chaves densas, 3 passos de leitura)
# + reinstauração no fim de cada frase: a rede consulta a memória e reinjeta a
# leitura no estado antes de ler a frase seguinte.
# Ablação limpa: a mesma config com model.reinstate=false (mesmos parâmetros, 1,50 M).
[run]
name = "b_reinstate"
seed = 1
data_dir = "data/generated/mvp2"

[model]
type = "episodic_gru"
write_mode = "token"
emb_dim = 128
hidden = 336
layers = 2
dropout = 0.1
mem_heads = 4
mem_dim = 48
key_dim = 48
key_topk = 0
read_hops = 3
familiarity = false
reinstate = true
question_position = "after"

[train]
batch_size = 64
lr = 2e-3
max_steps = 8000
warmup_steps = 500
eval_every = 500
early_stop_patience = 8
max_minutes = 180.0
