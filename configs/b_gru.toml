# Fase 2b — baseline recorrente. Mesmo orçamento de b_transformer e b_fastweight.
[run]
name = "b_gru"
seed = 1
data_dir = "data/generated/mvp2"

[model]
type = "gru"
emb_dim = 128
hidden = 384
layers = 2
dropout = 0.1
question_position = "after"

[train]
batch_size = 64
lr = 2e-3
max_steps = 8000
warmup_steps = 500
eval_every = 500
early_stop_patience = 8
max_minutes = 120.0
