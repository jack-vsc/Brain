# Iteração 6 — iteração 2 com passos de leitura ADAPTATIVOS (direção 3).
# Até 5 passos; a rede decide quando parar (estilo PonderNet) e paga um custo
# pequeno por passo esperado. Parâmetros extras: só a camada de parada (~340).
[run]
name = "b_adaptive"
seed = 1
data_dir = "data/generated/mvp2"

[model]
type = "fastweight_gru"
emb_dim = 128
hidden = 336
layers = 2
dropout = 0.1
mem_heads = 4
mem_dim = 48
read_hops = 5
adaptive_hops = true
ponder_cost = 0.01
question_position = "after"

[train]
batch_size = 64
lr = 2e-3
max_steps = 8000
warmup_steps = 500
eval_every = 500
early_stop_patience = 8
max_minutes = 120.0
