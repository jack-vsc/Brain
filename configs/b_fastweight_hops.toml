# Iteração 2 — memória rápida + 3 passos internos de leitura.
# hidden 336 (vs 352) compensa as camadas de controle e mantém ~1,5 M parâmetros.
[run]
name = "b_fastweight_hops"
seed = 1
data_dir = "data/generated/mvp2"

[model]
type = "fastweight_gru"
emb_dim = 128
hidden = 336
layers = 2
dropout = 0.1
mem_heads = 4
mem_dim = 48
read_hops = 3
question_position = "after"

[train]
batch_size = 64
lr = 2e-3
max_steps = 8000
warmup_steps = 500
eval_every = 500
early_stop_patience = 8
max_minutes = 120.0
