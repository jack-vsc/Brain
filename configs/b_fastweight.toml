# Fase 2b — protótipo GRU + memória rápida (regra delta). GRU menor para manter ~1,5 M parâmetros.
[run]
name = "b_fastweight"
seed = 1
data_dir = "data/generated/mvp2"

[model]
type = "fastweight_gru"
emb_dim = 128
hidden = 352
layers = 2
dropout = 0.1
mem_heads = 4
mem_dim = 48
question_position = "after"

[train]
batch_size = 64
lr = 2e-3
max_steps = 8000
warmup_steps = 500
eval_every = 500
early_stop_patience = 8
max_minutes = 120.0
