# Iteração 7 — iteração 2 + porta de esquecimento na regra delta (direção 2, Gated DeltaNet).
# Hipótese: decair memórias antigas ajuda em histórias longas. Parâmetros extras: ~1.350.
[run]
name = "b_gated"
seed = 1
data_dir = "data/generated/mvp2"

[model]
type = "fastweight_gru"
emb_dim = 128
hidden = 336
layers = 2
dropout = 0.1
mem_heads = 4
mem_dim = 48
read_hops = 3
forget_gate = true
question_position = "after"

[train]
batch_size = 64
lr = 2e-3
max_steps = 8000
warmup_steps = 500
eval_every = 500
early_stop_patience = 8
max_minutes = 120.0
