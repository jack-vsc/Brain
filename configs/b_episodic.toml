# Iteração 4 — memória episódica nas fronteiras de eventos, com reinstauração.
# Construída sobre o que funcionou na iteração 2 (chaves densas, 3 passos de
# leitura). Chaves esparsas e familiaridade ficaram de fora porque a iteração 3
# falhou e misturaria efeitos. hidden 336 → ~1,50 M parâmetros.
# Hipótese H6: ler a memória antes de escrever melhora tarefas que dependem do
# valor antigo ("onde estava antes?") e a generalização de comprimento.
[run]
name = "b_episodic"
seed = 1
data_dir = "data/generated/mvp2"

[model]
type = "episodic_gru"
emb_dim = 128
hidden = 336
layers = 2
dropout = 0.1
mem_heads = 4
mem_dim = 48
key_dim = 48
key_topk = 0
read_hops = 3
familiarity = false
reinstate = true
question_position = "after"

[train]
batch_size = 64
lr = 2e-3
max_steps = 8000
warmup_steps = 500
eval_every = 500
early_stop_patience = 8
max_minutes = 180.0
