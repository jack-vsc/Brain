[project]
name = "brain"
version = "0.1.0"
description = "Rede neural experimental do zero: micromundo em português, memória e aprendizado contínuo."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
# Versões exatas verificadas ficam em requirements.lock.txt.
# torch deve ser instalado a partir do índice CUDA do PyTorch (ver README).
dependencies = [
    "torch>=2.4",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
brain = "brain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
